name: Deploy production to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beget-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: gate
        shell: bash
        env:
          BEGET_SFTP_PASSWORD: ${{ secrets.BEGET_SFTP_PASSWORD }}
        run: |
          if [[ -n "$BEGET_SFTP_PASSWORD" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Production deploy is inactive. Add the BEGET_SFTP_PASSWORD repository secret to enable it."
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: npm ci

      - name: Build and deploy
        if: steps.gate.outputs.enabled == 'true'
        run: npm run deploy
        env:
          DEPLOY_PROTOCOL: sftp
          DEPLOY_HOST: zakharau.beget.tech
          DEPLOY_PORT: 22
          DEPLOY_USER: zakharau_hyperborea1
          DEPLOY_PASSWORD: ${{ secrets.BEGET_SFTP_PASSWORD }}
          DEPLOY_REMOTE_DIR: /home/z/zakharau_hyperborea1/hyperborea-lagends/public_html
          DEPLOY_SITE_URL: https://hyperborea-legends.ru
